name: site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
      - 'adr/**'
      - 'skills/adrkit-visualize/**'
      - 'tools/build-decision-atlas.mjs'
      - 'tools/atlas-preview.mjs'
      - 'assets/decision-atlas-*.png'
      - 'assets/favicon-*.svg'
      - 'src/**'
      - 'bin/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Astro raises its Node.js floor in patch releases (7.4.2 needs
          # 22.23.4), and setup-node's manifest lags the newest 22.x security
          # release (it resolved '22' to 22.23.3 on 2026-10-21). The newest
          # LTS line stays ahead of that floor; the CLI's own 22.22 floor is
          # verified by ci.yml, not here.
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      # The atlas page is generated from the current records, so the site
      # build needs the CLI's own dependencies and compiled dist.
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
