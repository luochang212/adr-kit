name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A push whose comparison commit was rewritten away (force-push) cannot
  # produce a green run; dispatch re-runs CI without inventing commits.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted macOS runners have queued with no runner assigned and
        # were cancelled after 15 minutes on every run after the last green
        # macOS job (2026-10-21 13:57Z), while Ubuntu and Windows stayed green.
        # Local macOS still runs the suite; re-add macos-latest when the hosted
        # queue recovers.
        os: [ubuntu-latest, windows-latest]
        # Both OSes cover the declared floor; the newest LTS runs once.
        node: ['22.22.0', '24']
        exclude:
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The real-shell completion tests (zpty ZLE run, fish) skip when the shell
      # is absent; install them so CI exercises the scripts it ships.
      - name: Install completion test shells
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The repository dogfoods its own records (AGENTS.md calls validation
      # failures success signals), so the gate AGENTS.md promises has to hold
      # in CI too, not only on contributor machines. Runs after build: the bin
      # entry loads dist/.
      - run: node bin/adrkit.js validate --all

  atlas-browser:
    name: decision atlas browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Tests the generated English and Chinese single-file artifacts offline.
      - run: npm run test:browser

  upstream:
    name: upstream grilling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm run check:upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm 11, whose audit uses the bulk advisory endpoint;
          # Node 22's npm 10 still targets the retired audits/quick endpoint.
          node-version: '24'
      - run: npm audit --audit-level high
      - run: npm audit --audit-level high
        working-directory: site
