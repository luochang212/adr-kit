name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Full history: base-aware archive validation reads the manifest and
      # sealed files at the comparison commit, which a shallow checkout of
      # the merge commit cannot see.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The repository dogfoods its own records (AGENTS.md calls validation
      # failures success signals), so the gate AGENTS.md promises has to hold
      # in CI too, not only on contributor machines. Runs after build: the bin
      # entry loads dist/.
      - run: node bin/adrkit.js validate --all
      # Append-only history is a diff property: a coordinated edit of an
      # archived file and its hash passes current-tree validation, so the
      # archive is also checked against the actual review base rather than an
      # assumed HEAD^. New branches and force-pushes report a zero "before"
      # sha and have no comparison commit to protect.
      - name: validate archive history against the comparison commit
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no comparison commit; current-tree validation already ran"
            exit 0
          fi
          node bin/adrkit.js validate --all --base "$BASE"

  upstream:
    name: upstream grilling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm run check:upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Node 22 ships npm 10, whose audit still targets the retired
      # audits/quick endpoint; npm 11 uses the bulk advisory endpoint.
      - run: npm install -g npm@11
      - run: npm audit --audit-level high
