name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A push whose comparison commit was rewritten away (force-push) cannot
  # produce a green run; dispatch re-runs CI without inventing commits.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted macOS runners have queued with no runner assigned and
        # were cancelled after 15 minutes on every run after the last green
        # macOS job (2026-10-21 13:57Z), while Ubuntu and Windows stayed green.
        # Local macOS still runs the suite; re-add macos-latest when the hosted
        # queue recovers.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The repository dogfoods its own records (AGENTS.md calls validation
      # failures success signals), so the gate AGENTS.md promises has to hold
      # in CI too, not only on contributor machines. Runs after build: the bin
      # entry loads dist/.
      - run: node bin/adrkit.js validate --all

  upstream:
    name: upstream grilling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm run check:upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Node 22 ships npm 10, whose audit still targets the retired
      # audits/quick endpoint; npm 11 uses the bulk advisory endpoint.
      - run: npm install -g npm@11
      - run: npm audit --audit-level high
