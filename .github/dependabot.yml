version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # vitest and its coverage provider must move together: separate PRs
      # regenerate the same lockfile tree and duplicate each other.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # Routine devDependency patch/minor churn rides in one monthly PR.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      # The only dependency that ships in the package; patch updates group,
      # majors stay separate.
      production-dependencies:
        dependency-type: production
        update-types:
          - patch
    ignore:
      # DefinitelyTyped publishes near-daily; patch/minor @types/node bumps
      # dominated every batch. Majors still land and realign the types.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
