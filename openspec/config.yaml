schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

# The decision inventory: archiving a change is the moment its settled
# decisions are still fresh. Reach for adrkit's importance bar, not every
# choice, so the guidance does not manufacture inflation.
operations:
  archive:
    guidance:
      - Before archiving, inventory the architectural decisions this change settled and check adr/ with "adrkit list". Record any that constrain future development and whose rationale is not apparent from code alone with "adrkit decide" or the "adrkit-grill" workflow, and mention the recorded ADR numbers in the archive summary.
